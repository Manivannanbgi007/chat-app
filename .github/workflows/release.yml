# Release (CD): a tag like v1.2.0 builds every image, scans it, pushes it to the GitHub container registry (ghcr.io)
# and - when you switched deployment on - updates the production server.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Production server deployment is OFF until you set the repository variable DEPLOY_ENABLED=true and the secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (see DEPLOYMENT_GUIDE.md "Release and rollback").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy again (rollback), for example v1.1.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway,            context: services/api-gateway }
          - { name: auth-service,           context: services/auth-service }
          - { name: user-service,           context: services/user-service }
          - { name: conversation-service,   context: services/conversation-service }
          - { name: message-service,        context: services/message-service }
          - { name: media-service,          context: services/media-service }
          - { name: presence-service,       context: services/presence-service }
          - { name: notification-service,   context: services/notification-service }
          - { name: call-signaling-service, context: services/call-signaling-service }
          - { name: status-service,         context: services/status-service }
          - { name: frontend,               context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: candidate/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan (a fixable CRITICAL vulnerability stops the release)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: candidate/${{ matrix.name }}:${{ github.ref_name }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    name: deploy to production
    needs: [publish]
    if: always() && vars.DEPLOY_ENABLED == 'true' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production      # add required reviewers to this environment = a person must approve every deployment
    steps:
      - name: Work out the tag
        id: tag
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Update the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/chat-app
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.tag.outputs.value }}/" infra/.env.prod
            bash infra/deploy.sh
