# Continuous integration: every push and pull request is built and tested.
#   backend   - each service on its own (own pom, own tests; Testcontainers starts MySQL/Redis/Kafka/RustFS)
#   frontend  - lint, type check + build, unit tests
#   security  - dependency and secret scan
#   images    - every Docker image builds, and a scan looks for known vulnerabilities
#   e2e       - the whole stack in Docker Compose: smoke test, security check and the browser tests
#               (only on main, nightly and when started by hand: it takes about 15 minutes)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"      # every night: catches new vulnerabilities in dependencies

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - conversation-service
          - message-service
          - media-service
          - presence-service
          - notification-service
          - call-signaling-service
          - status-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Build and test
        run: mvn -B verify
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build        # also type-checks the tests (tsc -b)
      - run: npm test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan also reads the history
      - name: Secrets in the code or history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vulnerable dependencies in the repository (Maven and npm lock files)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,target,dist
          exit-code: "1"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    name: images (build and scan)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create a throw-away .env (CI only, random values)
        run: bash infra/init-env.sh
      - name: Build every image
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env build
      - name: Scan the images (fails on a fixable CRITICAL vulnerability)
        run: |
          for image in $(docker compose -f infra/docker-compose.yml --env-file infra/.env config --images | grep '^chat-app-'); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "::endgroup::"
          done

  e2e:
    name: end-to-end (whole stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [images]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create a throw-away .env (CI only, random values)
        run: bash infra/init-env.sh
      - name: Start the whole stack
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --wait --wait-timeout 600
      - name: Smoke test (REST through the gateway)
        run: python3 infra/scripts/smoke-test.py
      - name: Security check (attacks from outside)
        run: python3 infra/scripts/security-check.py
      - name: Browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright test
        env:
          CI: "true"
      - name: Keep the browser report and the container logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose -f infra/docker-compose.yml --env-file infra/.env logs --no-color > ci-logs/containers.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            ci-logs
            frontend/playwright-report
            frontend/test-results
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env down -v
