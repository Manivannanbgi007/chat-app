# Values for the placeholders that application.yml expects from the environment.
# They are test-only and never used outside tests.
JWT_SECRET=test-only-jwt-secret-that-is-long-enough-123456
AUTH_DB_PASSWORD=unused
REDIS_PASSWORD=unused
# Run the outbox publisher quickly so Kafka tests do not wait long
chatapp.outbox.poll-ms=200
# Tests send email through FakeEmailService, never through a real mail server. Without this line Spring's mail
# health check tries to reach localhost:1025 (MailHog), and /actuator/health is DOWN when MailHog is not running.
management.health.mail.enabled=false
