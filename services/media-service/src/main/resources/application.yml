server:
  port: 8205
  shutdown: graceful

spring:
  application:
    name: media-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    # Lets you run from the IDE: reads passwords from infra/.env if the file exists.
    # (Run the service from its own folder, services/media-service.)
    import: "optional:file:../../infra/.env[.properties]"
  datasource:
    url: ${MEDIA_DB_URL:jdbc:mysql://localhost:3330/media_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MEDIA_DB_USERNAME:media_user}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the database schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR   # UUIDs are stored as readable CHAR(36)
  flyway:
    enabled: true
  servlet:
    multipart:
      # The real per-type limits are checked in the code (chatapp.media.limits); this is only the outer wall.
      max-file-size: 100MB
      max-request-size: 101MB

security:
  jwt:
    # Same secret as auth-service and api-gateway (at least 32 characters).
    secret: ${JWT_SECRET}
    issuer: chat-app-auth

chatapp:
  internal:
    # Secret for calls between services (header X-Internal-Token). At least 24 characters.
    token: ${INTERNAL_SERVICE_TOKEN}
  s3:
    # Where the service itself uploads to (inside Docker: http://s3:9000). RustFS locally, real S3 in production.
    endpoint: ${S3_ENDPOINT:http://localhost:9010}
    # The address that is written into signed links. The BROWSER must be able to reach it.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9010}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:chat-media}
    create-bucket: ${S3_CREATE_BUCKET:true}
  clamav:
    # The ClamAV daemon (clamd) used when VIRUS_SCANNER=clamav (docker-compose.clamav.yml, Phase 9)
    host: ${CLAMAV_HOST:clamav}
    port: ${CLAMAV_PORT:3310}
  media:
    # "none" (default, nothing is scanned: development) or "clamav" (production, files are scanned before they are stored)
    virus-scanner: ${VIRUS_SCANNER:none}
    limits-mb:
      image: 10
      video: 100
      document: 25
      audio: 25
      voice: 25
    max-image-side-px: 12000
    max-image-pixels: 50000000
    thumbnail-max-px: 320
    link-valid-seconds: 300
    cleanup:
      # Uploads that no message ever used are deleted after this many hours.
      max-age-hours: 24
      interval-ms: 3600000

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Prometheus compute p95 / p99 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # %X{correlationId} is filled by CorrelationIdFilter
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
