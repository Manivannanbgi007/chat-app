server:
  port: 8204
  shutdown: graceful

spring:
  application:
    name: message-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    # Lets you run from the IDE: reads passwords from infra/.env if the file exists.
    # (Run the service from its own folder, services/message-service.)
    import: "optional:file:../../infra/.env[.properties]"
  datasource:
    url: ${MESSAGE_DB_URL:jdbc:mysql://localhost:3330/message_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MESSAGE_DB_USERNAME:message_user}
    password: ${MESSAGE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the database schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR   # UUIDs are CHAR(36) columns
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6391}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    # We read conversation.events (group changes -> membership copy + SYSTEM messages)
    consumer:
      group-id: message-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      properties:
        enable.idempotence: true

chatapp:
  security:
    jwt-secret: ${JWT_SECRET}      # at least 32 characters, same value in every service
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}   # sent to other services in the X-Internal-Token header
  services:
    conversation-url: ${CONVERSATION_SERVICE_URL:http://localhost:8203}
    user-url: ${USER_SERVICE_URL:http://localhost:8202}
    media-url: ${MEDIA_SERVICE_URL:http://localhost:8205}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  websocket:
    # Browser origins that may open a WebSocket (comma separated)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5210,http://localhost:5280}
    session-check-seconds: 30
  messages:
    max-length: 4000
    sync-overlap-seconds: 10
  outbox:
    poll-ms: 500

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Prometheus compute p95 / p99 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # %X{correlationId} is filled by CorrelationIdFilter
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
