# Values for the placeholders that application.yml expects from the environment (test-only).
JWT_SECRET=test-only-jwt-secret-that-is-long-enough-123456
REDIS_PASSWORD=test
# Very high default limits so ordinary tests are never rate limited; RateLimitTest lowers them.
chatapp.ratelimit.auth.replenish-rate=1000
chatapp.ratelimit.auth.burst-capacity=1000
chatapp.ratelimit.api.replenish-rate=1000
chatapp.ratelimit.api.burst-capacity=1000
chatapp.ratelimit.messages.replenish-rate=1000
chatapp.ratelimit.messages.burst-capacity=1000
chatapp.ratelimit.media.replenish-rate=1000
chatapp.ratelimit.media.burst-capacity=1000
chatapp.ratelimit.calls.replenish-rate=1000
chatapp.ratelimit.calls.burst-capacity=1000
