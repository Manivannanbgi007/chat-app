server:
  port: 8202
  shutdown: graceful

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    # Lets you run from the IDE: reads passwords from infra/.env if the file exists.
    # (Run the service from its own folder, services/user-service.)
    import: "optional:file:../../infra/.env[.properties]"
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3330/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${USER_DB_USERNAME:user_user}
    password: ${USER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the database schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR   # UUIDs are stored as readable CHAR(36)
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    # Same secret as auth-service and api-gateway (at least 32 characters).
    secret: ${JWT_SECRET}
    issuer: chat-app-auth

chatapp:
  internal:
    # Shared secret for calls between services (header X-Internal-Token), at least 24 characters.
    token: ${INTERNAL_SERVICE_TOKEN}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Prometheus compute p95 / p99 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # %X{correlationId} is filled by CorrelationIdFilter
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
