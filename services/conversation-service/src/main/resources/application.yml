server:
  port: 8203
  shutdown: graceful

spring:
  application:
    name: conversation-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    # Lets you run from the IDE: reads passwords from infra/.env if the file exists.
    # (Run the service from its own folder, services/conversation-service.)
    import: "optional:file:../../infra/.env[.properties]"
  datasource:
    url: ${CONVERSATION_DB_URL:jdbc:mysql://localhost:3330/conversation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CONVERSATION_DB_USERNAME:conversation_user}
    password: ${CONVERSATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the database schema is owned by Flyway, Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR   # UUIDs are stored as readable CHAR(36)
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: conversation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

security:
  jwt:
    # Same secret as auth-service and api-gateway (at least 32 characters).
    secret: ${JWT_SECRET}
    issuer: chat-app-auth

chatapp:
  internal:
    # Secret for calls between services (header X-Internal-Token). At least 24 characters.
    token: ${INTERNAL_SERVICE_TOKEN}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8202}
  outbox:
    poll-ms: 500
  groups:
    max-members: 256   # including the creator

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Prometheus compute p95 / p99 latency
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # %X{correlationId} is filled by CorrelationIdFilter
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
