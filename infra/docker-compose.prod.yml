# PRODUCTION overlay (Phase 9). It changes the development stack into a production deployment:
#   - images come from the registry (built and scanned by .github/workflows/release.yml), nothing is built on the server
#   - ONLY ports 80 / 443 (Caddy, automatic HTTPS) and Coturn are open to the internet; MySQL, Redis, Kafka, the
#     object storage and every service are reachable only inside the Docker network
#   - Swagger is off, development helpers (MailHog, Kafka UI) are not started
#   - Coturn refuses to relay to private addresses and announces the public IP
#
# Use it through infra/deploy.sh, or by hand:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#                  -f infra/docker-compose.monitoring.yml --env-file infra/.env.prod up -d
# Settings: infra/.env.prod (copy of .env.prod.example). Full guide: DEPLOYMENT_GUIDE.md.

name: chat-app

x-prod-image: &prod-service
  pull_policy: always

services:
  # ---- Our services: use the released images, do not build ----
  api-gateway:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/api-gateway:${IMAGE_TAG}
    build: !reset null
    ports: !reset []
  auth-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/auth-service:${IMAGE_TAG}
    build: !reset null
  user-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/user-service:${IMAGE_TAG}
    build: !reset null
  conversation-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/conversation-service:${IMAGE_TAG}
    build: !reset null
  message-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/message-service:${IMAGE_TAG}
    build: !reset null
  media-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/media-service:${IMAGE_TAG}
    build: !reset null
  presence-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/presence-service:${IMAGE_TAG}
    build: !reset null
  notification-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/notification-service:${IMAGE_TAG}
    build: !reset null
  call-signaling-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/call-signaling-service:${IMAGE_TAG}
    build: !reset null
  status-service:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/status-service:${IMAGE_TAG}
    build: !reset null
  frontend:
    <<: *prod-service
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    build: !reset null
    ports: !reset []        # Caddy is the only way in

  # ---- HTTPS reverse proxy (certificates from Let's Encrypt, renewed by itself) ----
  # Caddy sends /api and /ws straight to the gateway (so the gateway sees the real client address for its rate
  # limits) and everything else to the frontend container (the static files).
  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is missing in infra/.env.prod}
      # "email you@example.com" for Let's Encrypt; "local_certs" for a test on your own computer
      CADDY_GLOBAL: ${CADDY_GLOBAL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"       # HTTP/3
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # the certificates: keep this volume, Let's Encrypt limits how often it issues new ones
      - caddy-config:/config
    depends_on:
      - frontend
      - api-gateway
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [chat-net]

  # ---- Infrastructure: nothing published to the host ----
  mysql:
    ports: !reset []
  redis:
    ports: !reset []
  kafka:
    ports: !reset []
  s3:
    ports: !reset []        # browsers reach it through Caddy at https://files.<DOMAIN> (signed links only)
  # development helpers: only start when you ask for the profile "dev-only"
  mailhog:
    profiles: ["dev-only"]
  kafka-ui:
    profiles: ["dev-only"]

  # ---- Coturn: production settings (SECURITY_DESIGN.md 7g) ----
  # command replaces the list of the development file, so it is complete here.
  coturn:
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is missing}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP (the public IP of this server) is missing in infra/.env.prod}
      - --fingerprint
      - --no-cli
      - --no-tls              # TURN over TLS (turns:, port 5349) needs a certificate file; see DEPLOYMENT_GUIDE.md
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      # Never relay to private networks: otherwise anybody with a TURN password could reach the database and the
      # other containers through the TURN server.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --user-quota=12       # at most 12 relay allocations per user
      - --total-quota=1200
      - --min-port=49160
      - --max-port=49200

volumes:
  caddy-data:
  caddy-config:
